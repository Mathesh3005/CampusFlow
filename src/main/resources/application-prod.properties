# Production database credentials are supplied by the deployment environment.
# SPRING_DATASOURCE_URL must use JDBC format: jdbc:postgresql://host:5432/database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=require

# Restrict production API CORS to the deployed frontend origin by default.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://frontend.campusflowapp.workers.dev}

# Production schema changes are applied through a separate, controlled process.
spring.flyway.enabled=true

# Avoid emitting SQL statements in production logs.
spring.jpa.show-sql=false
