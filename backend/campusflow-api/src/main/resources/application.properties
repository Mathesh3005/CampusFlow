spring.application.name=campusflow-api

# Base64-encoded HMAC key (at least 32 decoded bytes); supply via APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET}

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/campusflow_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Resume File Storage
app.file.storage-location=${RESUME_STORAGE_LOCATION:./uploads/resumes}
app.file.max-size=5242880
spring.servlet.multipart.max-file-size=${app.file.max-size}B
