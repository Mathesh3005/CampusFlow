<main class="register-page">
  <a class="brand" routerLink="/login" aria-label="CampusFlow home">
    <span class="brand-mark">C</span><span>CampusFlow</span>
  </a>
  <section class="register-card" aria-labelledby="register-title">
    <p class="eyebrow">STUDENT ACCOUNT</p>
    <h1 id="register-title">Create your account</h1>
    <p class="intro">Set up your student profile to discover opportunities and manage your placement journey.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (errorMessage()) { <p class="server-error" role="alert">{{ errorMessage() }}</p> }
      <div class="form-grid">
        <label class="field full-width">
          <span>Full name</span>
          <input formControlName="fullName" autocomplete="name" maxlength="150" required />
          @if (form.controls.fullName.touched && form.controls.fullName.invalid) { <small>Enter your name (up to 150 characters).</small> }
        </label>
        <label class="field full-width">
          <span>Institutional email</span>
          <input type="email" formControlName="email" autocomplete="email" maxlength="255" required />
          @if (form.controls.email.touched && form.controls.email.invalid) { <small>Enter a valid email address.</small> }
        </label>
        <label class="field">
          <span>Registration number</span>
          <input formControlName="registerNumber" maxlength="30" required />
          @if (form.controls.registerNumber.touched && form.controls.registerNumber.invalid) { <small>Registration number is required.</small> }
        </label>
        <label class="field">
          <span>Department</span>
          <input formControlName="department" maxlength="100" required />
          @if (form.controls.department.touched && form.controls.department.invalid) { <small>Department is required.</small> }
        </label>
        <label class="field full-width">
          <span>Graduation year</span>
          <input type="number" formControlName="graduationYear" min="2020" max="2040" required />
          @if (form.controls.graduationYear.touched && form.controls.graduationYear.invalid) { <small>Enter a year between 2020 and 2040.</small> }
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" formControlName="password" autocomplete="new-password" minlength="8" maxlength="72" required />
          @if (form.controls.password.touched && form.controls.password.invalid) { <small>Use 8 to 72 characters.</small> }
        </label>
        <label class="field">
          <span>Confirm password</span>
          <input type="password" formControlName="confirmPassword" autocomplete="new-password" required />
          @if (form.controls.confirmPassword.touched && form.hasError('passwordsMismatch')) { <small>Passwords do not match.</small> }
        </label>
      </div>
      <button class="submit-button" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Creating account…' : 'Create student account' }}
      </button>
    </form>

    <p class="login-link">Already have an account? <a routerLink="/login">Sign in</a></p>
    <p class="officer-note">Placement officer accounts are provisioned by your institution.</p>
  </section>
</main>
