<div class="workspace-shell" [class.nav-open]="mobileNavOpen()">
  <aside id="workspace-sidebar" class="workspace-sidebar" aria-label="Main navigation" (keydown.escape)="onSidebarEscape($event)">
    <a class="brand" [routerLink]="['/', role === 'STUDENT' ? 'student' : 'officer', 'dashboard']" (click)="closeMobileNavigation()">
      <span class="brand-mark">C</span>
      <span>CampusFlow</span>
    </a>

    <nav #navigationElement class="navigation-list">
      @for (item of navigation; track item.path) {
        <a
          class="navigation-link"
          [routerLink]="['/', role === 'STUDENT' ? 'student' : 'officer', item.path]"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobileNavigation()"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-role">{{ roleLabel() }}</div>
  </aside>

  @if (mobileNavOpen()) {
    <button class="navigation-backdrop" type="button" aria-label="Close navigation" (click)="closeMobileNavigation()"></button>
  }

  <div class="workspace-main">
    <header class="topbar">
      <button #menuToggle class="menu-toggle" type="button" aria-label="Toggle navigation" aria-controls="workspace-sidebar" [attr.aria-expanded]="mobileNavOpen()" (click)="toggleMobileNavigation()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="topbar-role">{{ roleLabel() }} workspace</span>
      <div class="user-summary">
        <span class="user-email">{{ user()?.email }}</span>
        <span class="user-role">{{ user()?.role }}</span>
      </div>
    </header>

    <main class="workspace-content">
      <router-outlet />
    </main>
  </div>
</div>
